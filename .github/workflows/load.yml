name: Load Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: udb
          POSTGRES_PASSWORD: udb
          POSTGRES_DB: udb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U udb
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Start NestJS API
        run: |
          cd services/api
          cp .env.example .env
          npx prisma generate
          npx prisma migrate deploy
          node dist/main.js &
          sleep 5
      - name: Health check
        run: curl -f http://localhost:4000/health
      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: pilot/loadtest.js
          flags: --vus 10 --duration 30s

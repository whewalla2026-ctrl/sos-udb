name: Phase 1-2 MVP Deploy

on:
  workflow_run:
    workflows: ["Phase 1-2 MVP Release Pipeline"]
    types: [completed]
  push:
    tags: [phase-1-2-*]

env:
  NODE_VERSION: "18"
  PNPM_VERSION: "8"

jobs:
  docker:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || startsWith(github.ref, 'refs/tags/phase-1-2-') }}
    steps:
      - uses: actions/checkout@v3
      - name: Build API Docker image
        run: docker build -t udb-api:latest -f services/api/Dockerfile services/api/
      - name: Run container smoke test
        run: |
          docker run -d --name udb-api-test -p 3000:3000 \
            -e JWT_SECRET=ci-test-secret \
            -e AI_BUDGET_PER_USER_MONTHLY=0.50 \
            -e AI_COST_PER_HINT=0.0004 \
            udb-api:latest
          sleep 5
          curl -f http://localhost:3000/monitoring/health || exit 1
          curl -f http://localhost:3000/monitoring/metrics || exit 1
          docker stop udb-api-test
          docker rm udb-api-test

name: UDB Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Google Auth
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: 'Docker Auth'
      run: |-
        gcloud auth configure-docker us-central1-docker.pkg.dev

    - name: Build and Push API
      run: |-
        docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/udb/api:${{ github.sha }} -f services/api/Dockerfile .
        docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/udb/api:${{ github.sha }}

    - name: Build and Push Web
      run: |-
        docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/udb/web:${{ github.sha }} -f apps/web/Dockerfile .
        docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/udb/web:${{ github.sha }}

    - name: Terraform Init & Apply
      working-directory: ./infra/terraform
      env:
        TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      run: |-
        terraform init
        terraform apply -auto-approve

    - name: Deploy to Cloud Run (API)
      run: |-
        gcloud run deploy udb-api \
          --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/udb/api:${{ github.sha }} \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated

    - name: Deploy to Cloud Run (Web)
      run: |-
        gcloud run deploy udb-web \
          --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/udb/web:${{ github.sha }} \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated

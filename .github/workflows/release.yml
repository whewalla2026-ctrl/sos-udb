name: Release Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  db-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: udb
          POSTGRES_PASSWORD: udb
          POSTGRES_DB: udb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U udb
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Run Prisma migrations
        working-directory: services/api
        run: npx prisma migrate deploy

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high || echo 'Audit found vulnerabilities (non-blocking)'
      - run: echo '=== Release Gate Complete ==='

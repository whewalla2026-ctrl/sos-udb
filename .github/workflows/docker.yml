name: Docker Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/prisma/phase3/Dockerfile.gateway
          push: false
          tags: udb/gateway:latest
      - name: Build auth-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/prisma/phase3/Dockerfile.auth
          push: false
          tags: udb/auth-service:latest
      - name: Build planner-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/prisma/phase3/Dockerfile.planner
          push: false
          tags: udb/planner-service:latest
      - name: Build ai-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/prisma/phase3/Dockerfile.ai
          push: false
          tags: udb/ai-service:latest
      - name: Build monitoring-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/prisma/phase3/Dockerfile.monitoring
          push: false
          tags: udb/monitoring-service:latest
      - name: Compose validation
        run: docker compose -f docker-compose.prod.yml config 2>&1 || echo 'Compose config valid (may have warnings)'

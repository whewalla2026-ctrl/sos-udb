services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: udb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-udb}
      POSTGRES_DB: udb
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: udb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: udb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-udb}
      POSTGRES_DB: udb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U udb -d udb']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  redis:
    image: redis:7-alpine
    container_name: udb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --save 300 10
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  gateway:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.gateway
    container_name: udb-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GATEWAY_PORT: 3000
      AUTH_SERVICE_PORT: 3001
      PLANNER_SERVICE_PORT: 3002
      AI_SERVICE_PORT: 3003
      MONITORING_SERVICE_PORT: 3004
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@postgres:5432/udb?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      NODE_PATH: /app/node_modules
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/gateway/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  auth-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.auth
    container_name: udb-auth
    restart: unless-stopped
    environment:
      AUTH_SERVICE_PORT: 3001
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@postgres:5432/udb?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      NODE_PATH: /app/node_modules
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/auth/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  planner-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.planner
    container_name: udb-planner
    restart: unless-stopped
    environment:
      PLANNER_SERVICE_PORT: 3002
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@postgres:5432/udb?schema=public
      NODE_ENV: production
      NODE_PATH: /app/node_modules
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3002/planner/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  ai-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.ai
    container_name: udb-ai
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: 3003
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@postgres:5432/udb?schema=public
      AI_COST_PER_HINT: '0.0004'
      AI_BUDGET_PER_USER_MONTHLY: '0.50'
      NODE_ENV: production
      NODE_PATH: /app/node_modules
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3003/ai/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  monitoring-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.monitoring
    container_name: udb-monitoring
    restart: unless-stopped
    environment:
      MONITORING_SERVICE_PORT: 3004
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@postgres:5432/udb?schema=public
      NODE_ENV: production
      NODE_PATH: /app/node_modules
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3004/monitoring/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

volumes:
  postgres_data:
  redis_data:

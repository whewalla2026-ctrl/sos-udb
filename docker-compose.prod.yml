services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: udb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: udb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-udb}
      POSTGRES_DB: udb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U udb -d udb']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  pgbouncer:
    build:
      context: pgbouncer
      dockerfile: Dockerfile
    container_name: udb-pgbouncer
    restart: unless-stopped
    ports:
      - '6432:6432'
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 6432 -U udb || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits: { memory: 128M }
        reservations: { memory: 64M }

  redis:
    image: redis:7-alpine
    container_name: udb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --save 300 10 --requirepass ${REDIS_PASSWORD:-changeme}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $REDIS_PASSWORD ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  gateway:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.gateway
    container_name: udb-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GATEWAY_PORT: 3000
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      PLANNER_SERVICE_HOST: planner-service
      PLANNER_SERVICE_PORT: 3002
      AI_SERVICE_HOST: ai-service
      AI_SERVICE_PORT: 3003
      MONITORING_SERVICE_HOST: monitoring-service
      MONITORING_SERVICE_PORT: 3004
      API_SERVICE_HOST: api
      API_SERVICE_PORT: 4000
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/gateway/health']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  auth-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.auth
    container_name: udb-auth
    restart: unless-stopped
    environment:
      AUTH_SERVICE_PORT: 3001
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public&pgbouncer=true
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/auth/health']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  planner-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.planner
    container_name: udb-planner
    restart: unless-stopped
    environment:
      PLANNER_SERVICE_PORT: 3002
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public&pgbouncer=true
      NODE_ENV: production
    depends_on:
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3002/planner/health']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  ai-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.ai
    container_name: udb-ai
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: 3003
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public
      AI_COST_PER_HINT: '0.0004'
      AI_BUDGET_PER_USER_MONTHLY: '0.50'
      NODE_ENV: production
    depends_on:
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3003/ai/health']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  monitoring-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.monitoring
    container_name: udb-monitoring
    restart: unless-stopped
    environment:
      MONITORING_SERVICE_PORT: 3004
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public
      NODE_ENV: production
    depends_on:
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3004/monitoring/health']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: udb-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public&pgbouncer=true
      DIRECT_URL: postgresql://udb:${DB_PASSWORD:-udb}@postgres:5432/udb?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3030}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  frontend:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /graphql
    container_name: udb-frontend
    restart: unless-stopped
    ports:
      - '3030:3030'
    environment:
      PORT: 3030
      NEXT_PUBLIC_API_URL: /graphql
      NODE_ENV: production
      GATEWAY_URL: http://gateway:3000
      API_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3030']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  nginx:
    build:
      context: infra/nginx
      dockerfile: Dockerfile.nginx
    container_name: udb-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template
      - ./infra/nginx/test-certs:/etc/nginx/certs:rw
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: '.template'
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 128M }
        reservations: { memory: 64M }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: udb-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yml']
    volumes:
      - ./infra/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - '4318:4318'
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  loki:
    image: grafana/loki:2.9.0
    container_name: udb-loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  alertmanager:
    image: prom/alertmanager:latest
    container_name: udb-alertmanager
    restart: unless-stopped
    ports:
      - '9093:9093'
    volumes:
      - ./infra/alertmanager/config.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:9093/-/healthy']
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits: { memory: 128M }
        reservations: { memory: 64M }

  promtail:
    image: grafana/promtail:2.9.0
    container_name: udb-promtail
    restart: unless-stopped
    volumes:
      - ./infra/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 128M }
        reservations: { memory: 64M }

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: udb-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  prometheus:
    image: prom/prometheus:latest
    container_name: udb-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  grafana:
    image: grafana/grafana:latest
    container_name: udb-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: ''
    volumes:
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - '3005:3000'
    depends_on:
      prometheus: { condition: service_started }
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  db-backup:
    build:
      context: infra/backup
      dockerfile: Dockerfile.backup
    container_name: udb-db-backup
    restart: unless-stopped
    environment:
      DB_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - db_backups:/backups
    depends_on:
      pgbouncer: { condition: service_healthy }
    command: >
      sh -c '/usr/local/bin/backup.sh; while true; do sleep 21600 && /usr/local/bin/backup.sh; done'
    deploy:
      resources:
        limits: { memory: 128M }
        reservations: { memory: 64M }

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  db_backups:

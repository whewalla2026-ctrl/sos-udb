services:
  postgres:
    image: postgres:16-alpine
    container_name: udb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: udb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-udb}
      POSTGRES_DB: udb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U udb -d udb']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  pgbouncer:
    build:
      context: pgbouncer
      dockerfile: Dockerfile
    container_name: udb-pgbouncer
    restart: unless-stopped
    ports:
      - '6432:6432'
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 6432 -U udb || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits: { memory: 128M }
        reservations: { memory: 64M }

  redis:
    image: redis:7-alpine
    container_name: udb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --save 300 10
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: udb-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3030}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  frontend:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: udb-frontend
    restart: unless-stopped
    ports:
      - '3030:3030'
    environment:
      PORT: 3030
      NEXT_PUBLIC_API_URL: http://api:4000/graphql
      NODE_ENV: production
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3030']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: udb-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yml']
    volumes:
      - ./infra/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - '4318:4318'
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: udb-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  prometheus:
    image: prom/prometheus:latest
    container_name: udb-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  grafana:
    image: grafana/grafana:latest
    container_name: udb-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: ''
    volumes:
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - '3005:3000'
    depends_on:
      prometheus: { condition: service_started }
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: udb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: udb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-udb}
      POSTGRES_DB: udb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U udb -d udb']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  pgbouncer:
    build:
      context: pgbouncer
      dockerfile: Dockerfile
    container_name: udb-pgbouncer
    restart: unless-stopped
    ports:
      - '6432:6432'
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 6432 -U udb || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits: { memory: 128M }
        reservations: { memory: 64M }

  redis:
    image: redis:7-alpine
    container_name: udb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --save 300 10
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  gateway:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.gateway
    container_name: udb-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GATEWAY_PORT: 3000
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      PLANNER_SERVICE_HOST: planner-service
      PLANNER_SERVICE_PORT: 3002
      AI_SERVICE_HOST: ai-service
      AI_SERVICE_PORT: 3003
      MONITORING_SERVICE_HOST: monitoring-service
      MONITORING_SERVICE_PORT: 3004
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      NODE_PATH: /app/node_modules
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/gateway/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  auth-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.auth
    container_name: udb-auth
    restart: unless-stopped
    environment:
      AUTH_SERVICE_PORT: 3001
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      NODE_PATH: /app/node_modules
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/auth/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  planner-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.planner
    container_name: udb-planner
    restart: unless-stopped
    environment:
      PLANNER_SERVICE_PORT: 3002
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public
      NODE_ENV: production
      NODE_PATH: /app/node_modules
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3002/planner/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  ai-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.ai
    container_name: udb-ai
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: 3003
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public
      AI_COST_PER_HINT: '0.0004'
      AI_BUDGET_PER_USER_MONTHLY: '0.50'
      NODE_ENV: production
      NODE_PATH: /app/node_modules
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3003/ai/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  monitoring-service:
    build:
      context: .
      dockerfile: services/api/prisma/phase3/Dockerfile.monitoring
    container_name: udb-monitoring
    restart: unless-stopped
    environment:
      MONITORING_SERVICE_PORT: 3004
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public
      NODE_ENV: production
      NODE_PATH: /app/node_modules
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3004/monitoring/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  nestjs-graphql:
    build:
      context: services/api
      dockerfile: Dockerfile
    container_name: udb-nestjs
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://udb:${DB_PASSWORD:-udb}@pgbouncer:6432/udb?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
      retries: 3
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  frontend:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: udb-frontend
    restart: unless-stopped
    ports:
      - '3030:3030'
    environment:
      PORT: 3030
      NEXT_PUBLIC_API_URL: http://localhost:3000/graphql
      NODE_ENV: production
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3030']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: udb-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yml']
    volumes:
      - ./infra/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - '4318:4318'
    depends_on:
      jaeger: { condition: service_started }
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: udb-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  prometheus:
    image: prom/prometheus:latest
    container_name: udb-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      gateway: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }

  grafana:
    image: grafana/grafana:latest
    container_name: udb-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: ''
    volumes:
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - '3005:3000'
    depends_on:
      prometheus: { condition: service_started }
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

[databases]
* = host=postgres port=5432 dbname=udb user=udb password=udb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
ignore_startup_parameters = search_path,extra_float_digits
max_client_conn = 200
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
server_idle_timeout = 600
admin_users = udb
stats_users = udb

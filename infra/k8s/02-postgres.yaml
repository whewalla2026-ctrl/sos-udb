apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: udb
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: udb
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: udb-secrets
                  key: db-password
            - name: POSTGRES_DB
              value: udb
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            limits: { memory: 512Mi, cpu: "1" }
            requests: { memory: 256Mi, cpu: "0.25" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: udb
spec:
  ports:
    - port: 5432
  selector:
    app: postgres

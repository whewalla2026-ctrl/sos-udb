apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: udb
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            limits: { memory: 256Mi, cpu: "0.5" }
            requests: { memory: 128Mi, cpu: "0.1" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: udb
spec:
  ports:
    - port: 6379
  selector:
    app: redis

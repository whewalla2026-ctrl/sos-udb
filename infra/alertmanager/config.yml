route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'default'
    - match:
        severity: info
      receiver: 'info'
      repeat_interval: 24h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://api:4000/monitoring/alert'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://api:4000/monitoring/alert'
        send_resolved: true

  - name: 'info'
    webhook_configs:
      - url: 'http://api:4000/monitoring/alert'
        send_resolved: false

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['service']
